server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: physicsplay-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${PHYSICSPLAY_DB_URL:${SUPABASE_DB_URL}}
    username: ${PHYSICSPLAY_DB_USER:${SUPABASE_DB_USER}}
    password: ${PHYSICSPLAY_DB_PASSWORD:${SUPABASE_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      transactional: false 
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  supabase:
    api-key: ${PHYSICSPLAY_SUPABASE_API_KEY:${SUPABASE_API_KEY:}}
  google-ai:
    api-key: ${PHYSICSPLAY_GOOGLE_AI_API_KEY:${GOOGLE_AI_STUDIO_API_KEY:}}
    model: ${PHYSICSPLAY_GOOGLE_AI_MODEL:${GOOGLE_AI_MODEL:gemini-3.1-flash-lite}}
    connect-timeout-ms: ${GOOGLE_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GOOGLE_AI_READ_TIMEOUT_MS:15000}
