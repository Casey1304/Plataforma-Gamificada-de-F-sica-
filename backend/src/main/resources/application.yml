server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: physicsplay-backend
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      transactional: false 
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  supabase:
    api-key: ${SUPABASE_API_KEY:}
  google-ai:
    api-key: ${GOOGLE_AI_STUDIO_API_KEY:}
    model: ${GOOGLE_AI_MODEL:gemini-2.0-flash}
    connect-timeout-ms: ${GOOGLE_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GOOGLE_AI_READ_TIMEOUT_MS:15000}
